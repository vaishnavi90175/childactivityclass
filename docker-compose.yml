
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: childactivitydb1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2111"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d childactivitydb1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "9000:9000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/childactivitydb1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "2111"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:9000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
